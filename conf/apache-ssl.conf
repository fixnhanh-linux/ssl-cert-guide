# ============================================================================
# Apache 2.4 — VirtualHost 443 (mẫu, sửa tên miền và đường dẫn trước khi dùng)
#
# Debian/Ubuntu: /etc/apache2/sites-available/example.com.conf
#                sudo a2enmod ssl headers rewrite && sudo a2ensite example.com
#                sudo apache2ctl configtest && sudo systemctl reload apache2
#
# RHEL/Rocky:    /etc/httpd/conf.d/example.com.conf
#                sudo httpd -t && sudo systemctl reload httpd
# ============================================================================

<VirtualHost *:80>
    ServerName example.com
    ServerAlias www.example.com
    DocumentRoot /var/www/example.com/public

    # ACME phải đi qua HTTP, trước mọi rewrite.
    Alias /.well-known/acme-challenge/ /var/www/example.com/public/.well-known/acme-challenge/
    <Directory "/var/www/example.com/public/.well-known/acme-challenge/">
        Require all granted
        Options -Indexes
        ForceType text/plain
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName example.com
    ServerAlias www.example.com
    DocumentRoot /var/www/example.com/public

    SSLEngine on

    # Apache 2.4.8+: chain nằm LUÔN trong SSLCertificateFile.
    # SSLCertificateChainFile đã deprecated — đừng dùng nữa.
    SSLCertificateFile      /etc/letsencrypt/live/example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/example.com/privkey.pem

    <Directory "/var/www/example.com/public">
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/example.com.error.log
    CustomLog ${APACHE_LOG_DIR}/example.com.access.log combined
</VirtualHost>
