# ============================================================================
# nginx — TLS hardening (chỉ phần SSL, không phải cả server block)
#
# Dùng khi không có /etc/letsencrypt/options-ssl-nginx.conf, hoặc muốn tự kiểm
# soát toàn bộ tham số. Đặt nội dung này TRONG block server 443.
#
# Mục tiêu: SSL Labs hạng A (thêm HSTS để lên A+).
# ============================================================================

# Chỉ TLS 1.2 và 1.3. TLS 1.0/1.1 đã bị RFC 8996 khai tử.
ssl_protocols TLSv1.2 TLSv1.3;

# TLS 1.3 tự quy định cipher; danh sách này áp cho TLS 1.2.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# Để client chọn cipher (khuyến nghị hiện tại: ưu tiên ChaCha20 trên thiết bị
# không có AES tăng tốc, ví dụ điện thoại tầm trung).
ssl_prefer_server_ciphers off;

# Session cache: giảm chi phí bắt tay lại
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling — client không phải gọi CA
ssl_stapling on;
ssl_stapling_verify on;
ssl_trusted_certificate /etc/letsencrypt/live/example.com/chain.pem;
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;

# HSTS — TĂNG DẦN, đừng bật 1 năm ngay từ đầu.
# Bắt đầu:  max-age=300
# Sau khi kiểm tra hết subdomain: max-age=31536000
# Chỉ thêm includeSubDomains khi MỌI subdomain đã có HTTPS.
add_header Strict-Transport-Security "max-age=300" always;

# Header phụ, không ảnh hưởng điểm SSL nhưng nên có
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
