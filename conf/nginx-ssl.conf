# ============================================================================
# nginx — block server 443 (mẫu, sửa tên miền và đường dẫn trước khi dùng)
#
# Đặt tại: /etc/nginx/sites-available/example.com  (Debian/Ubuntu)
#          /etc/nginx/conf.d/example.com.conf      (RHEL/Rocky)
# Kiểm tra: nginx -t && systemctl reload nginx
# ============================================================================

# --- HTTP: chỉ để redirect và trả ACME challenge -----------------------------
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # PHẢI đặt trước location / và không bị redirect nuốt mất.
    # Nếu thiếu block này, certbot renew sẽ thất bại với lỗi 404.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/example.com/public;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS -------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # nginx >= 1.25.1. Bản cũ hơn: bỏ dòng này và dùng
    #   listen 443 ssl http2;
    http2 on;

    server_name example.com www.example.com;

    # fullchain.pem = cert + intermediate. KHÔNG dùng cert.pem ở đây.
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Bộ tham số do certbot sinh (protocol, cipher, session, OCSP).
    # Nếu file không tồn tại, xem nginx-tls-hardening.conf trong repo này.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/example.com/public;
    index index.php index.html;

    access_log /var/log/nginx/example.com.access.log;
    error_log  /var/log/nginx/example.com.error.log warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Chặn truy cập file ẩn, trừ challenge
    location ~ /\.(?!well-known) {
        deny all;
    }
}
