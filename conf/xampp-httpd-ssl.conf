# ============================================================================
# XAMPP trên Windows — conf/extra/httpd-ssl.conf
#
# Trước khi dùng, trong C:\xampp\apache\conf\httpd.conf phải bỏ dấu # ở:
#   LoadModule ssl_module modules/mod_ssl.so
#   Include conf/extra/httpd-ssl.conf
#
# LƯU Ý WINDOWS:
#   - Dùng dấu / trong đường dẫn, không dùng \ (tránh lỗi escape).
#   - Đường dẫn có dấu cách phải đặt trong ngoặc kép.
#   - Kiểm tra trùng cổng trước:  netstat -ano | findstr :443
# ============================================================================

Listen 443

# --- Protocol & cipher -------------------------------------------------------
# Bỏ TLS 1.0/1.1. Nếu có thiết bị nội bộ quá cũ bắt buộc TLS 1.0, tách riêng
# một VirtualHost cho thiết bị đó thay vì hạ chuẩn toàn server.
SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
SSLCipherSuite HIGH:!aNULL:!MD5:!RC4:!3DES:!DSS

SSLHonorCipherOrder off

# Đường dẫn TƯƠNG ĐỐI hay gây lỗi "SSLSessionCache: Invalid argument" trên
# Windows. Dùng tuyệt đối với dấu / như dưới đây.
SSLSessionCache "shmcb:C:/xampp/apache/logs/ssl_scache(512000)"
SSLSessionCacheTimeout 300

<VirtualHost _default_:443>
    DocumentRoot "C:/xampp/htdocs"
    ServerName localhost:443
    ServerAdmin admin@localhost

    ErrorLog  "C:/xampp/apache/logs/error.log"
    TransferLog "C:/xampp/apache/logs/access.log"

    SSLEngine on

    # Cert: self-signed cho dev, hoặc fullchain.pem nếu dùng cert thật.
    SSLCertificateFile    "C:/xampp/apache/conf/ssl.crt/server.crt"
    SSLCertificateKeyFile "C:/xampp/apache/conf/ssl.key/server.key"

    # Nếu CA gửi chain riêng (cert thật), nối vào server.crt:
    #   type server.crt ca-bundle.crt > fullchain.crt
    # rồi trỏ SSLCertificateFile vào fullchain.crt.
    # SSLCertificateChainFile "C:/certs/ca-bundle.crt"   # chỉ với Apache cũ

    <FilesMatch "\.(cgi|shtml|phtml|php)$">
        SSLOptions +StdEnvVars
    </FilesMatch>

    <Directory "C:/xampp/cgi-bin">
        SSLOptions +StdEnvVars
    </Directory>

    BrowserMatch "MSIE [2-5]" nokeepalive ssl-unclean-shutdown

    # Header phụ (cần LoadModule headers_module)
    Header always set X-Content-Type-Options "nosniff"
</VirtualHost>

# --- Tạo cert self-signed cho dev -------------------------------------------
# cd C:\xampp\apache\bin
# openssl req -x509 -nodes -days 825 -newkey rsa:2048 ^
#   -keyout C:\xampp\apache\conf\ssl.key\server.key ^
#   -out C:\xampp\apache\conf\ssl.crt\server.crt ^
#   -subj "/CN=localhost" ^
#   -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
#
# Thiếu -addext subjectAltName thì trình duyệt hiện đại vẫn báo
# ERR_CERT_COMMON_NAME_INVALID dù CN đúng, vì chúng bỏ qua CN.
