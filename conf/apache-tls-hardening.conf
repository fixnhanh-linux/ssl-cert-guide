# ============================================================================
# Apache 2.4 — TLS hardening
#
# Đặt trong VirtualHost 443, hoặc trong file include toàn cục:
#   Debian/Ubuntu: /etc/apache2/conf-available/tls-hardening.conf
#   RHEL/Rocky:    /etc/httpd/conf.d/tls-hardening.conf
#
# Cần module: mod_ssl, mod_headers
# ============================================================================

# Chỉ TLS 1.2 và 1.3
SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
SSLHonorCipherOrder off

# Session cache
SSLSessionCache "shmcb:/var/run/apache2/ssl_scache(512000)"
SSLSessionCacheTimeout 300

# OCSP stapling
SSLUseStapling on
SSLStaplingCache "shmcb:/var/run/apache2/ssl_stapling(32768)"
SSLStaplingResponderTimeout 5
SSLStaplingReturnResponderErrors off

# HSTS — tăng dần. Bắt đầu 300, chỉ thêm includeSubDomains khi chắc chắn.
Header always set Strict-Transport-Security "max-age=300"

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# --- Ghi chú RHEL/CentOS -----------------------------------------------------
# 1. SELinux: cert ngoài /etc/pki/tls sẽ bị chặn
#      semanage fcontext -a -t cert_t "/etc/letsencrypt(/.*)?"
#      restorecon -Rv /etc/letsencrypt
# 2. OCSP stapling cần Apache nối ra ngoài
#      setsebool -P httpd_can_network_connect 1
# 3. Đường dẫn /var/run/apache2 chỉ có trên Debian. Trên RHEL dùng
#      SSLSessionCache "shmcb:/run/httpd/ssl_scache(512000)"
