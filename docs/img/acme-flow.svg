<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="624" viewBox="0 0 1180 624" role="img" aria-labelledby="t d">
  <title id="t">Luồng ACME: HTTP-01 và DNS-01</title>
  <desc id="d">certbot tạo order với Let&#x27;s Encrypt, CA xác thực qua file trên cổng 80 hoặc bản ghi TXT DNS, rồi trả cert về.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f7fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
<marker id="ar-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F59E0B"/></marker>
<marker id="ar-web" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
<marker id="ar-php" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B5CF6"/></marker>
<marker id="ar-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10B981"/></marker>
<marker id="ar-cache" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EAB308"/></marker>
<marker id="ar-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker>
<marker id="ar-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#22C55E"/></marker>
<marker id="ar-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/></marker>
<marker id="ar-cmd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0891B2"/></marker>
  </defs>

  <style>
    text { font-family: "Segoe UI","Helvetica Neue",Arial,"Noto Sans",sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #0b1220; }
    .sub   { font-size: 13.5px; fill: #64748b; }
    .n     { font-size: 16px; font-weight: 650; }
    .s     { font-size: 12.5px; fill: #64748b; }
    .mono  { font-family: "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; font-size: 12.5px; }
    .band  { font-size: 13px; font-weight: 700; letter-spacing: .2px; }

    .flow {
      fill: none; stroke-width: 2.8; stroke-linecap: round;
      stroke-dasharray: 2 12;
      animation: flow 1.15s linear infinite;
    }
    @keyframes flow { to { stroke-dashoffset: -28; } }

    .dashflow {
      fill: none; stroke-width: 2.2; stroke-dasharray: 8 7;
      animation: dashflow 1.7s linear infinite;
    }
    @keyframes dashflow { to { stroke-dashoffset: -30; } }

    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: .95 } }

    @media (prefers-reduced-motion: reduce) {
      .flow, .dashflow, .pulse { animation: none; }
    }
  </style>

  <rect x="0" y="0" width="1180" height="624" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1179" height="623" rx="18" fill="none" stroke="#e2e8f0"/>

<text x="36" y="52" class="title">Hai cách xác thực: HTTP-01 và DNS-01</text>
<text x="36" y="80" class="sub">Mũi tên chuyển động theo chiều thông điệp — nét đứt là phản hồi</text>
<rect x="80" y="112" width="200" height="64" rx="13" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.8" filter="url(#shadow)"/>
<text x="180.0" y="138.0" text-anchor="middle" class="mono" fill="#164E63" style="font-size:15px">certbot</text>
<text x="180.0" y="157.5" text-anchor="middle" class="s" fill="#164E63">trên server</text>
<rect x="480" y="112" width="200" height="64" rx="13" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.8" filter="url(#shadow)"/>
<text x="580.0" y="138.0" text-anchor="middle" class="n" fill="#4C1D95" style="font-size:15px">Let&#x27;s Encrypt</text>
<text x="580.0" y="157.5" text-anchor="middle" class="s" fill="#4C1D95">ACME server</text>
<rect x="876" y="112" width="228" height="64" rx="13" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8" filter="url(#shadow)"/>
<text x="990.0" y="138.0" text-anchor="middle" class="n" fill="#1E3A8A" style="font-size:15px">Web server :80</text>
<text x="990.0" y="157.5" text-anchor="middle" class="s" fill="#1E3A8A">hoặc DNS (bản ghi TXT)</text>
<line x1="180" y1="180" x2="180" y2="556" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="3 5"/>
<line x1="580" y1="180" x2="580" y2="556" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="3 5"/>
<line x1="990" y1="180" x2="990" y2="556" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="3 5"/>
<rect x="36" y="206" width="1108" height="176" rx="13" fill="#EFF6FF" fill-opacity="0.45" stroke="#BFDBFE" stroke-dasharray="7 5"/>
<rect x="46" y="216" width="104" height="26" rx="13" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.4"/><text x="98.0" y="233.5" text-anchor="middle" class="band" fill="#1E3A8A">HTTP-01</text>
<path d="M180 256 L574 256" fill="none" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="2" marker-end="url(#ar-client)"/>
<path d="M180 256 L574 256" class="flow" stroke="#F59E0B" style="animation-delay:-0.0s"/>
<circle r="4.4" fill="#F59E0B" filter="url(#glow)"><animateMotion dur="2.4s" begin="0.40s" repeatCount="indefinite" path="M180 256 L574 256"/></circle>
<text x="380.0" y="248" text-anchor="middle" fill="#1e3a8a" style="font-size:12px;font-weight:600">① tạo order + nhận token</text>
<path d="M580 288 L984 288" fill="none" stroke="#3B82F6" stroke-opacity="0.35" stroke-width="2" marker-end="url(#ar-web)"/>
<path d="M580 288 L984 288" class="flow" stroke="#3B82F6" style="animation-delay:-0.0s"/>
<circle r="4.4" fill="#3B82F6" filter="url(#glow)"><animateMotion dur="2.4s" begin="0.10s" repeatCount="indefinite" path="M580 288 L984 288"/></circle>
<text x="785.0" y="280" text-anchor="middle" fill="#1e3a8a" style="font-size:12px;font-weight:600">② GET /.well-known/acme-challenge/token</text>
<path d="M990 320 L586 320" fill="none" stroke="#3B82F6" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ar-web)"/>
<path d="M990 320 L586 320" class="dashflow" stroke="#3B82F6" opacity="0.85"/>
<circle r="4.4" fill="#3B82F6" filter="url(#glow)"><animateMotion dur="2.4s" begin="0.50s" repeatCount="indefinite" path="M990 320 L586 320"/></circle>
<text x="785.0" y="312" text-anchor="middle" fill="#1e3a8a" style="font-size:12px;font-weight:600">③ 200 + nội dung token</text>
<path d="M580 352 L186 352" fill="none" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ar-php)"/>
<path d="M580 352 L186 352" class="dashflow" stroke="#8B5CF6" opacity="0.85"/>
<circle r="4.4" fill="#8B5CF6" filter="url(#glow)"><animateMotion dur="2.4s" begin="0.20s" repeatCount="indefinite" path="M580 352 L186 352"/></circle>
<text x="380.0" y="344" text-anchor="middle" fill="#1e3a8a" style="font-size:12px;font-weight:600">④ ký cert → trả fullchain</text>
<rect x="36" y="400" width="1108" height="156" rx="13" fill="#ECFDF5" fill-opacity="0.5" stroke="#A7F3D0" stroke-dasharray="7 5"/>
<rect x="46" y="410" width="96" height="26" rx="13" fill="#ECFDF5" stroke="#10B981" stroke-width="1.4"/><text x="94.0" y="427.5" text-anchor="middle" class="band" fill="#064E3B">DNS-01</text>
<path d="M180 448 L574 448" fill="none" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="2" marker-end="url(#ar-client)"/>
<path d="M180 448 L574 448" class="flow" stroke="#F59E0B" style="animation-delay:-0.0s"/>
<circle r="4.4" fill="#F59E0B" filter="url(#glow)"><animateMotion dur="2.4s" begin="0.30s" repeatCount="indefinite" path="M180 448 L574 448"/></circle>
<text x="380.0" y="440" text-anchor="middle" fill="#065f46" style="font-size:12px;font-weight:600">① tạo order (kể cả wildcard)</text>
<path d="M580 480 L984 480" fill="none" stroke="#10B981" stroke-opacity="0.35" stroke-width="2" marker-end="url(#ar-data)"/>
<path d="M580 480 L984 480" class="flow" stroke="#10B981" style="animation-delay:-0.0s"/>
<circle r="4.4" fill="#10B981" filter="url(#glow)"><animateMotion dur="2.4s" begin="0.00s" repeatCount="indefinite" path="M580 480 L984 480"/></circle>
<text x="785.0" y="472" text-anchor="middle" fill="#065f46" style="font-size:12px;font-weight:600">② query TXT _acme-challenge</text>
<path d="M990 512 L586 512" fill="none" stroke="#10B981" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ar-data)"/>
<path d="M990 512 L586 512" class="dashflow" stroke="#10B981" opacity="0.85"/>
<circle r="4.4" fill="#10B981" filter="url(#glow)"><animateMotion dur="2.4s" begin="0.20s" repeatCount="indefinite" path="M990 512 L586 512"/></circle>
<text x="785.0" y="504" text-anchor="middle" fill="#065f46" style="font-size:12px;font-weight:600">③ trả giá trị TXT</text>
<path d="M580 540 L186 540" fill="none" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ar-php)"/>
<path d="M580 540 L186 540" class="dashflow" stroke="#8B5CF6" opacity="0.85"/>
<circle r="4.4" fill="#8B5CF6" filter="url(#glow)"><animateMotion dur="2.4s" begin="0.00s" repeatCount="indefinite" path="M580 540 L186 540"/></circle>
<text x="380.0" y="532" text-anchor="middle" fill="#065f46" style="font-size:12px;font-weight:600">④ ký cert → trả fullchain</text>
<rect x="36" y="572" width="1108" height="38" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-dasharray="7 5"/>
<text x="56" y="596" text-anchor="start" fill="#92400E" style="font-size:12px;font-weight:600">certbot KHÔNG tự reload web server — dùng --deploy-hook</text>
<text x="700" y="596" text-anchor="start" fill="#92400E" style="font-size:12px;font-weight:600">· DNS-01 là cách duy nhất cấp wildcard</text>
</svg>